<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening app…</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      background: #1e293b;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #94a3b8; margin: 0 0 20px; font-size: 0.95rem; }
    a {
      display: inline-block;
      margin: 6px;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      color: white;
      background: #2563eb;
    }
    a.secondary { background: #334155; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Opening app…</h1>
    <p id="subtitle">If the app is not installed, redirecting to the App Store.</p>
    <div id="actions" style="display:none">
      <a id="store-link" href="#">Open App Store</a>
      <a class="secondary" id="retry-link" href="#">Try again</a>
    </div>
  </div>

  <script>
    const CONFIG = {
      customScheme: "mrtdeeplink",
      iosAppStore: "https://apps.apple.com/app/id0000000000",
      redirectDelayMs: 2200
    };

    const path = window.location.pathname + window.location.search;
    const deepPath = path.startsWith("/") ? path : "/" + path;
    const customSchemeURL = CONFIG.customScheme + ":/" + deepPath;

    function isIOS() {
      return /iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    function openApp() {
      if (isIOS()) {
        window.location.href = customSchemeURL;
        return;
      }

      document.getElementById("title").textContent = "Download the iOS app";
      document.getElementById("subtitle").textContent = "Open this link on an iPhone.";
      showActions(CONFIG.iosAppStore);
    }

    function showActions(url) {
      const actions = document.getElementById("actions");
      document.getElementById("store-link").href = url;
      document.getElementById("retry-link").href = customSchemeURL;
      actions.style.display = "block";
    }

    function fallbackToStore() {
      document.getElementById("title").textContent = "App not found";
      document.getElementById("subtitle").textContent = "Redirecting to the App Store…";
      showActions(CONFIG.iosAppStore);
      window.location.href = CONFIG.iosAppStore;
    }

    let redirected = false;
    const timer = setTimeout(function () {
      if (!document.hidden && !redirected) {
        redirected = true;
        fallbackToStore();
      }
    }, CONFIG.redirectDelayMs);

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        clearTimeout(timer);
      }
    });

    openApp();
  </script>
</body>
</html>
